# SCAFFOLD ONLY -- never applied against a real cluster. Valid YAML
# (parses correctly), sensible defaults, not more than that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-servicing-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: card-servicing-backend
  template:
    metadata:
      labels:
        app: card-servicing-backend
    spec:
      containers:
        - name: backend
          image: card-servicing-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: card-servicing-secrets
                  key: database-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: card-servicing-secrets
                  key: anthropic-api-key
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
